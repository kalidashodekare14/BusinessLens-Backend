name: businesslens

services:
  postgres:
    image: postgres:16
    container_name: bl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-businesslens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-businesslens}
      POSTGRES_DB: ${POSTGRES_DB:-businesslens}
    ports:
      - '5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7
    container_name: bl-redis
    restart: unless-stopped
    ports:
      - '6381:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  pgdata:
  redisdata:
